services:
  - type: web
    name: AS-AuraX-Bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: TARGET_BOT
        value: "@ASxAura_bot"
      - key: BOT_USERNAME
        sync: false
      - key: CHANNEL_URL
        value: "https://t.me/ModAppsKing"
